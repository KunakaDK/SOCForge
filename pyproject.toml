[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socforge-blue-team-lab"
version = "1.0.0"
description = "A defensive SOC engineering lab for security telemetry, detection, triage, incident tracking, and auditable operations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SOCForge contributors"}]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
socforge = "socforge.cli:main"

[tool.setuptools.packages.find]
include = ["socforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
socforge = ["dashboard.html"]
